<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https: 'unsafe-inline' 'unsafe-eval' data: blob:; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss:;">
  <title>Couple Expense Tracker</title>

  <!-- PWA Settings -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#e91e63" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Expenses" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2344/2344132.png" />

  <!-- Tailwind CSS (CDN for simplicity) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: 'var(--primary)',
            secondary: 'var(--secondary)',
            accent: 'var(--accent)',
            surface: 'var(--surface)',
            background: 'var(--background)',
            text: 'var(--text)',
            'text-light': 'var(--text-light)',
          },
          fontFamily: {
            sans: 'var(--font-family)',
          },
          animation: {
            'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
            'scale-in': 'scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1)',
            'fade-in': 'fadeIn 0.3s ease-in-out',
            'shimmer': 'shimmer 2s infinite linear',
            'shake': 'shake 0.3s ease-in-out',
          },
          keyframes: {
            slideUp: {
              '0%': { opacity: 0, transform: 'translateY(15px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
            scaleIn: {
              '0%': { opacity: 0, transform: 'scale(0.95)' },
              '100%': { opacity: 1, transform: 'scale(1)' },
            },
            fadeIn: {
              '0%': { opacity: 0 },
              '100%': { opacity: 1 },
            },
            shimmer: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(100%)' },
            },
            shake: {
              '0%, 100%': { transform: 'translateX(0)' },
              '25%': { transform: 'translateX(-5px)' },
              '75%': { transform: 'translateX(5px)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* --- LIGHT MODE (default) -------------------------------------- */
    :root {
      /* Brand */
      --primary: #e91e63;
      --primary-hsl: 339, 79%, 50%;
      --secondary: #2196f3;
      --accent: #ff6f00;

      /* Surface layers (light) */
      --bg-base:     #f4f2ef;
      --bg-raised:   #faf9f6;
      --surface-0:   #ffffff;
      --surface-1:   #f7f5f1;
      --surface-2:   #f0ede8;
      --surface-3:   #e8e4de;

      /* Text */
      --text-primary:   #111113;
      --text-secondary: #4b4754;
      --text-tertiary:  #8a8596;
      --text-placeholder: #b7b2c2;

      /* Borders */
      --border-default: rgba(17,17,19,0.08);
      --border-subtle:  rgba(17,17,19,0.04);
      --border-strong:  rgba(17,17,19,0.16);
      --border-focus:   rgba(233,30,99,0.45);

      /* Input / form */
      --control-bg:          #f0ede8;
      --control-bg-hover:    #ebe7e1;
      --control-text:        #111113;
      --control-placeholder: #b7b2c2;
      --control-border:      rgba(17,17,19,0.08);
      --control-border-strong: rgba(17,17,19,0.18);
      --control-shadow:      0 1px 0 rgba(255,255,255,0.6), 0 8px 20px rgba(17,17,19,0.08);
      --control-shadow-open: 0 0 0 1px rgba(233,30,99,0.2), 0 12px 28px rgba(17,17,19,0.12);

      --input-bg:          var(--control-bg);
      --input-bg-hover:    var(--control-bg-hover);
      --input-text:        var(--control-text);
      --input-placeholder: var(--control-placeholder);
      --input-border:      var(--control-border);
      --input-border-focus: var(--primary);

      /* Dropdown / popover surface */
      --popover-bg:     #ffffff;
      --popover-border: rgba(17,17,19,0.10);
      --popover-shadow: 0 24px 80px rgba(17,17,19,0.12), 0 8px 24px rgba(17,17,19,0.08);

      /* Shadows and glows */
      --shadow-subtle: 0 2px 10px rgba(17,17,19,0.08);
      --shadow-card:   0 8px 30px rgba(17,17,19,0.10);
      --shadow-raised: 0 14px 40px rgba(17,17,19,0.12);
      --glow-primary:  0 0 26px rgba(233,30,99,0.16);
      --glow-blue:     0 0 24px rgba(33,150,243,0.18);
      --glow-amber:    0 0 24px rgba(255,111,0,0.18);

      /* Focus ring */
      --ring-focus: 0 0 0 3px rgba(233,30,99,0.22);

      /* Semantic */
      --success:     #16a34a;
      --success-bg:  rgba(22,163,74,0.08);
      --warning:     #d97706;
      --warning-bg:  rgba(217,119,6,0.08);
      --danger:      #dc2626;
      --danger-bg:   rgba(220,38,38,0.08);

      /* Typography */
      --font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;

      /* Legacy aliases for backward compatibility */
      --surface: var(--surface-0);
      --background: var(--bg-base);
      --text: var(--text-primary);
      --text-light: var(--text-secondary);

      /* Glass */
      --glass: rgba(255,255,255,0.6);
      --glass-border: rgba(255,255,255,0.8);

      /* Gradient */
      --accent-gradient: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);
    }

    /* --- DARK MODE -------------------------------------------------- */
    .dark {
      /* Surface layers (dark) */
      --bg-base:    #0b0b10;
      --bg-raised:  #121218;
      --surface-0:  #17171f;
      --surface-1:  #1d1d27;
      --surface-2:  #242431;
      --surface-3:  #2c2c3a;

      /* Text */
      --text-primary:   #f4f3fa;
      --text-secondary: #b2adbf;
      --text-tertiary:  #78728c;
      --text-placeholder: #5a556c;

      /* Borders */
      --border-default: rgba(255,255,255,0.08);
      --border-subtle:  rgba(255,255,255,0.05);
      --border-strong:  rgba(255,255,255,0.16);
      --border-focus:   rgba(233,30,99,0.55);

      /* Input / form */
      --control-bg:          rgba(255,255,255,0.04);
      --control-bg-hover:    rgba(255,255,255,0.08);
      --control-text:        #f4f3fa;
      --control-placeholder: #5a556c;
      --control-border:      rgba(255,255,255,0.08);
      --control-border-strong: rgba(255,255,255,0.18);
      --control-shadow:      0 10px 30px rgba(0,0,0,0.35);
      --control-shadow-open: 0 0 0 1px rgba(233,30,99,0.25), 0 18px 50px rgba(0,0,0,0.5);

      --input-bg:           var(--control-bg);
      --input-bg-hover:     var(--control-bg-hover);
      --input-text:         var(--control-text);
      --input-placeholder:  var(--control-placeholder);
      --input-border:       var(--control-border);

      /* Dropdown / popover surface */
      --popover-bg:     #1b1b24;
      --popover-border: rgba(255,255,255,0.1);
      --popover-shadow: 0 28px 90px rgba(0,0,0,0.65), 0 8px 24px rgba(0,0,0,0.45);

      /* Shadows and glows */
      --shadow-subtle: 0 6px 18px rgba(0,0,0,0.35);
      --shadow-card:   0 10px 34px rgba(0,0,0,0.45);
      --shadow-raised: 0 16px 50px rgba(0,0,0,0.6);
      --glow-primary:  0 0 30px rgba(233,30,99,0.28);
      --glow-blue:     0 0 30px rgba(33,150,243,0.25);
      --glow-amber:    0 0 30px rgba(255,111,0,0.25);

      /* Focus ring */
      --ring-focus: 0 0 0 3px rgba(233,30,99,0.3);

      /* Semantic */
      --success:     #4ade80;
      --success-bg:  rgba(74,222,128,0.08);
      --warning:     #fbbf24;
      --warning-bg:  rgba(251,191,36,0.08);
      --danger:      #f87171;
      --danger-bg:   rgba(248,113,113,0.08);

      /* Legacy aliases */
      --surface: var(--surface-0);
      --background: var(--bg-base);
      --text: var(--text-primary);
      --text-light: var(--text-secondary);

      /* Glass */
      --glass: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.07);
    }

    /* --- GLOBAL BASE STYLES ---------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-family);
      transition: background-color 0.35s cubic-bezier(0.4,0,0.2,1),
                  color 0.35s cubic-bezier(0.4,0,0.2,1);
      -webkit-tap-highlight-color: transparent;
      background-image:
        radial-gradient(ellipse at 0% 0%,   rgba(233,30,99,0.07)  0px, transparent 55%),
        radial-gradient(ellipse at 100% 0%,  rgba(33,150,243,0.05) 0px, transparent 55%),
        radial-gradient(ellipse at 50% 100%, rgba(255,111,0,0.04)  0px, transparent 55%);
      background-attachment: fixed;
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
    }

    .dark body {
      background-image:
        radial-gradient(ellipse at 0% 0%,   rgba(233,30,99,0.09)  0px, transparent 50%),
        radial-gradient(ellipse at 100% 0%,  rgba(33,150,243,0.06) 0px, transparent 50%);
    }

    html { scroll-behavior: smooth; overflow-x: hidden; width: 100%; }
    #root { overflow-x: hidden; width: 100%; }

    /* --- FOCUS RINGS (custom, no browser default) ------------------ */
    :focus { outline: none; }
    :focus-visible {
      box-shadow: var(--ring-focus);
      outline: none;
    }

    /* --- FORM CONTROL RESETS --------------------------------------- */
    input, textarea {
      background: var(--input-bg);
      color: var(--input-text);
      border: 1.5px solid var(--input-border);
      border-radius: 12px;
      box-shadow: var(--control-shadow);
      transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }
    input::placeholder, textarea::placeholder {
      color: var(--input-placeholder);
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--control-border-strong);
      box-shadow: var(--control-shadow-open);
      background: var(--input-bg-hover);
    }
    /* Suppress native date input in dark mode */
    input[type="date"] { color-scheme: dark; }
    .dark input[type="date"] { color-scheme: dark; }
    :root:not(.dark) input[type="date"] { color-scheme: light; }

    /* Native select: fully hidden; we replace with CustomSelect */
    select { appearance: none; -webkit-appearance: none; }

    /* --- PREMIUM SCROLLBAR ----------------------------------------- */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(120,120,120,0.3);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    /* --- PRIVACY MODE ---------------------------------------------- */
    .privacy-active .mask-value {
      filter: blur(8px);
      user-select: none;
      pointer-events: none;
      transition: filter 0.3s ease;
    }
  </style>

{
  "imports": {

  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
